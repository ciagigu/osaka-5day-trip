<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f0ea"><title>大阪 5 日旅</title><style>html,body{margin:0;min-height:100%;background:#f4f0ea;color:#171714;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.loading{min-height:100vh;display:grid;place-items:center;padding:28px;text-align:center}.box{max-width:360px}.box b{display:block;font-family:Georgia,serif;font-size:30px;font-weight:400;margin-bottom:10px}.box span{font-size:13px;color:#777168}.bar{height:2px;background:#ddd5cb;margin-top:20px;overflow:hidden}.bar:after{content:"";display:block;width:45%;height:100%;background:#7b252d;animation:move 1.2s ease-in-out infinite}@keyframes move{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}button{margin-top:16px;border:0;border-radius:999px;background:#171714;color:white;padding:10px 16px}</style></head><body><div class="loading"><div class="box"><b>大阪 5 日旅</b><span>GRAN RESPIRE OSAKA｜8/27–8/31</span><div class="bar"></div></div></div><script>(async()=>{try{const files=['g01.txt','g02a1.txt','g02fix937.txt','g02a2_2.txt','g02b.txt','g03.txt','g04.txt','g05.txt','g06.txt','g07a1_1.txt','g07a1_2.txt','g07a2.txt','g07b.txt','g08.txt','g09.txt','g10.txt'];const parts=await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error('Missing '+f);return (await r.text()).trim()}));parts[2]=parts[2].slice(0,656)+'l'+parts[2].slice(656)+'9';const b64=parts.join('');const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('請使用最新版 Safari 或 Chrome');const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="loading"><div class="box"><b>載入失敗</b><span>'+e.message+'</span><br><button onclick="location.reload()">重新整理</button></div></div>'}})();</script></body></html>
