const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function h(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function links(arr){return (arr||[]).map(x=>`<a class="link" target="_blank" rel="noopener" href="${h(x.href)}">${h(x.label)} ↗</a>`).join('')}
function showPage(id){$$('.mainnav button').forEach(b=>b.classList.toggle('active',b.dataset.page===id));$$('.page').forEach(p=>p.classList.toggle('active',p.id===id));window.scrollTo({top:0,behavior:'instant'})}
$$('.mainnav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));
function renderDays(){$('#days').innerHTML=DATA.days.map((d,i)=>`<button class="daybtn ${i===0?'active':''}" data-i="${i}"><b>${h(d.date)}</b><span>${h(d.short)}</span></button>`).join('');$$('.daybtn').forEach(b=>b.onclick=()=>{$$('.daybtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderDay(+b.dataset.i)});renderDay(0)}
function renderDay(i){const d=DATA.days[i];$('#dayview').innerHTML=`<div class="dayhead"><div class="ey">DAY ${i+1} · ${h(d.date)}</div><h2>${h(d.title)}</h2><p>${h(d.note)}</p><div class="chips">${d.chips.map(c=>`<span>${h(c)}</span>`).join('')}</div></div><div class="timeline">${d.stops.map(s=>`<article class="stop"><div class="time">${h(s[0])}</div><div><h3>${h(s[1])}</h3><div class="transport">${h(s[2])}</div><div class="links">${links(s[4])}</div>${s[3]?`<details class="note"><summary>備註</summary><p>${h(s[3])}</p></details>`:''}</div></article>`).join('')}</div>`}
function renderCats(obj,catSel,viewSel){const keys=Object.keys(obj);$(catSel).innerHTML=keys.map((k,i)=>`<button class="cat ${i===0?'active':''}" data-k="${h(k)}">${h(obj[k].name)}</button>`).join('');function render(k){const x=obj[k];$(viewSel).innerHTML=`${x.intro?`<div class="intro">${h(x.intro)}</div>`:''}<div class="cardlist">${x.cards.map(c=>`<details class="card"><summary>${h(c.title)}</summary><div class="cardbody">${c.body?`<p>${h(c.body)}</p>`:''}<div class="links">${links(c.links)}</div></div></details>`).join('')}</div>`} $$(catSel+' .cat').forEach(b=>b.onclick=()=>{$$(catSel+' .cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.k)});if(keys[0])render(keys[0])}
function renderShops(area='全部'){const list=DATA.shops.filter(x=>area==='全部'||x.area===area);$('#shops').innerHTML=list.map(x=>`<article class="shop"><div class="area">${h(x.area)}</div><h3>${h(x.title)}</h3>${x.desc?`<p>${h(x.desc)}</p>`:''}<div class="links">${links(x.links)}</div></article>`).join('')||'<div class="intro">這個區域目前沒有卡店資料。</div>'}
const areas=['全部','梅田','心齋橋','難波','日本橋','京都'];$('#filters').innerHTML=areas.map((a,i)=>`<button class="filter ${i===0?'active':''}" data-a="${a}">${a}</button>`).join('');$$('.filter').forEach(b=>b.onclick=()=>{$$('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderShops(b.dataset.a)});
renderDays();renderCats(DATA.guide,'#guideCats','#guideView');renderCats(DATA.ops,'#toolCats','#toolView');renderShops();
</script></body></html>
